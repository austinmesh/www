name: Update Discord Event

on:
  workflow_dispatch:
  schedule:
    # Daily at 10:17 UTC (4:17 AM CST / 5:17 AM CDT), after evening events have ended.
    # Odd minute avoids GitHub's top-of-the-hour scheduling backlog. Quiet days (no event
    # changes) produce no diff, so no PR.
    - cron: "17 10 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update src/data/events.json from Discord
        env:
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: bash scripts/update-discord-event.sh

      - name: Check if files changed
        id: files_changed
        run: |
          # Check if any files were modified by the script
          if git diff --quiet; then
            echo "No changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Files changed:"
            git diff --name-only
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request if files changed
        if: steps.files_changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update events from Discord"
          title: "Update events from Discord"
          body: "Automated update of upcoming events from Discord. Runs daily; this PR updates in place until merged."
          branch: update-discord-event-bot
          delete-branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
